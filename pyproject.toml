[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LLMGraphTransformer"
version = "0.0.2"
description = "A powerful tool for transforming documents into graph-based structures using Large Language Models (LLMs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["LLM", "graph transformation", "machine learning", "document processing", "natural language processing","text to graph","document to graph"]
dependencies = [
    "falkordb>=1.6.0",
    "fastapi>=0.135.1",
    "json-repair",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-falkordb>=0.1.2",
    "langchain-neo4j>=0.7.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.11",
    "langchain_core",
    "langgraph>=1.1.2",
    "pydantic",
    "pypdf>=6.7.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
]

[project.urls]
Homepage = "https://github.com/dhiaaeddine16/LLMGraphTransformer"

[tool.uv]
# langchain-falkordb 0.1.2 impone upper-bound stretti su langchain-core<0.4.0
# e langchain-community<0.4.0, incompatibili con le versioni recenti di langchain.
# Il pacchetto funziona correttamente con le versioni più nuove.
override-dependencies = [
    "langchain-core>=0.3.21",
    "langchain-community>=0.3.9",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
