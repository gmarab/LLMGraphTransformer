services:

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - BASE_URL=http://ollama:11434
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Per GPU NVIDIA, decommentare:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  falkordb_data:
  ollama_data:
